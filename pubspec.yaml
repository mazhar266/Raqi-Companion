name: raqi_companion
description: Offline companion of Quranic ayats and adhkar for ruqyah shari'ah.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  # Required by the vendored QQL binding in lib/qql/vendor/qql.dart.
  # Not used on web, where dart:ffi does not exist.
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/ruqyah.json
