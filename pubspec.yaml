name: raqi_companion
description: Offline companion of Quranic ayats and adhkar for ruqyah shari'ah.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  # Required by the vendored QQL binding in lib/qql/vendor/qql.dart.
  # Not used on web, where dart:ffi does not exist.
  ffi: ^2.1.0
  # Locates the directory QQL data is unpacked into. See lib/qql/qql_data.dart.
  path_provider: ^2.1.0
  # Export/restore of the user's lists. Pinned to a prerelease deliberately:
  # the current stable (11.0.3) applies its own Kotlin Gradle Plugin, which
  # Flutter 3.44's built-in Kotlin rejects, and the Android build fails. Move
  # to 12.x stable when it ships.
  file_picker: ^12.0.0-beta.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/ruqyah.json
    - assets/data/surahs.json
    - assets/icon/app_icon.png
    # QQL data. The native library reads these with std::fs, so they are
    # unpacked to app storage at first launch (lib/qql/qql_data.dart) rather
    # than read from the bundle. Asset directories are not recursive, so every
    # leaf directory has to be listed.
    - sources/quran-json-arabic/dist/chapters/en/
    # One file per ayah, for the flat Quran form (Q::100).
    - sources/quran-json-arabic/dist/verses/
    - sources/Hisn-Muslim-Json/
    # Whole-book files, for the flat hadith form (B::6018).
    - sources/hadith-json/db/by_book/the_9_books/
    - sources/hadith-json/db/by_chapter/the_9_books/abudawud/
    - sources/hadith-json/db/by_chapter/the_9_books/ahmed/
    - sources/hadith-json/db/by_chapter/the_9_books/bukhari/
    - sources/hadith-json/db/by_chapter/the_9_books/darimi/
    - sources/hadith-json/db/by_chapter/the_9_books/ibnmajah/
    - sources/hadith-json/db/by_chapter/the_9_books/malik/
    - sources/hadith-json/db/by_chapter/the_9_books/muslim/
    - sources/hadith-json/db/by_chapter/the_9_books/nasai/
    - sources/hadith-json/db/by_chapter/the_9_books/tirmidhi/
